# Builds dograh's MinIO image from a chainguard-forks/minio release tag and
# publishes it as dograhai/minio:<date> and ghcr.io/dograh-hq/minio:<date>.
#
# The weekly run picks up the newest upstream RELEASE.* tag and exits early if
# it has already been published. Each published tag gets a GitHub release here
# carrying the exact source tarball, which is our AGPL corresponding source.
#
# Publishing a new tag changes nothing for dograh users: the compose files and
# Helm chart pin a specific tag, and bumping that pin is a separate PR.

name: Build dograh MinIO image

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: "chainguard-forks/minio tag to build (empty = newest RELEASE.* tag)"
        required: false

permissions:
  contents: write # create the source release
  packages: write # push to ghcr.io
  actions: write # keepalive (see last step)

env:
  UPSTREAM: chainguard-forks/minio
  DOCKERHUB_IMAGE: dograhai/minio
  GHCR_IMAGE: ghcr.io/dograh-hq/minio

concurrency:
  group: dograh-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Image tag is the upstream release date (RELEASE.2026-09-22T19-25-18Z ->
      # 2026.09.22); a later upstream release on the same day gets -2, -3, ...
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          upstream_tags=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM" 'RELEASE.*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$' | sort)
          tag="${INPUT_TAG:-$(echo "$upstream_tags" | tail -1)}"
          day="${tag:8:10}"
          n=$(echo "$upstream_tags" | grep "^RELEASE\.${day}T" | grep -n -x -F "$tag" | cut -d: -f1)
          if [ -z "$n" ]; then
            echo "::error::'$tag' is not a RELEASE.* tag of $UPSTREAM"
            exit 1
          fi
          image_tag="${day//-/.}"
          if [ "$n" -gt 1 ]; then image_tag="$image_tag-$n"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Upstream $tag -> image tag $image_tag"

      - name: Check whether already published
        id: check
        run: |
          if gh release view "${{ steps.tag.outputs.image_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.tag.outputs.image_tag }} already published, nothing to do."
          fi

      - name: Check out build files
        if: steps.check.outputs.published != 'true'
        uses: actions/checkout@v4
        with:
          path: dograh

      - name: Check out upstream source
        if: steps.check.outputs.published != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.tag.outputs.tag }}
          path: src

      - name: Read commit id
        if: steps.check.outputs.published != 'true'
        id: src
        run: echo "commit=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check.outputs.published != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.check.outputs.published != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        if: steps.check.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: src
          file: dograh/Dockerfile.dograh
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_TAG=${{ steps.tag.outputs.tag }}
            COMMIT_ID=${{ steps.src.outputs.commit }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=minio
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.src.outputs.commit }}
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=MinIO built from https://github.com/${{ env.UPSTREAM }}/tree/${{ steps.tag.outputs.tag }}

      - name: Publish source release
        if: steps.check.outputs.published != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          COMMIT: ${{ steps.src.outputs.commit }}
        run: |
          git -C src archive --format=tar.gz --prefix="minio-$IMAGE_TAG/" -o "$PWD/minio-$IMAGE_TAG-source.tar.gz" HEAD
          gh release create "$IMAGE_TAG" "minio-$IMAGE_TAG-source.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$IMAGE_TAG" \
            --notes "MinIO \`$TAG\` built from [$UPSTREAM@${COMMIT:0:12}](https://github.com/$UPSTREAM/commit/$COMMIT) with \`Dockerfile.dograh\`.

          Images: \`$DOCKERHUB_IMAGE:$IMAGE_TAG\`, \`$GHCR_IMAGE:$IMAGE_TAG\` (linux/amd64, linux/arm64).

          The attached tarball is the complete corresponding source (AGPL-3.0-or-later)."

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity, and this repo rarely gets commits.
      # Re-enabling through the API on every run resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/dograh-image.yml/enable"
